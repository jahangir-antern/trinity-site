<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trinity AI Boston</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Preserves path segments when loading direct URLs like /trinity-site/platform
      var pathSegmentsToKeep = 1; // for /trinity-site/
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?page=' +
        encodeURIComponent(path) + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
